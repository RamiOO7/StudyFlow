<!DOCTYPE html><html lang="es"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><title>StudyFlow</title>
<style>
:root{--bg:#0b0d1a;--pan:#12152a;--p2:#191d38;--bd:#242949;--tx:#e8eaf6;--mu:#8b91b9;--ac:#6366f1;--ok:#22c55e;--wa:#f59e0b;--er:#ef4444;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
:root[data-theme=light]{--bg:#f2f3fb;--pan:#fff;--p2:#f0f1fa;--bd:#e0e2f2;--tx:#1b1e3a;--mu:#6b7194}
html{overflow-x:hidden;overscroll-behavior-x:none;max-width:100%;touch-action:pan-y pinch-zoom}
body{overflow-x:clip;max-width:100%;touch-action:pan-y pinch-zoom}
*{box-sizing:border-box;margin:0}
.g>*,.cd{min-width:0}html{scroll-padding-top:env(safe-area-inset-top,0px)}
body{background:var(--bg);color:var(--tx);font:14px/1.45 system-ui,-apple-system,"Segoe UI",Roboto,sans-serif}
button,input,select{font:inherit;color:inherit}button{cursor:pointer}
:focus-visible{outline:2px solid var(--ac);outline-offset:2px}
aside{position:fixed;top:0;bottom:0;left:0;width:228px;background:var(--pan);border-right:1px solid var(--bd);padding:calc(16px + env(safe-area-inset-top,0px)) 12px 16px;display:flex;flex-direction:column;gap:3px;z-index:30;overflow:auto;transition:transform .2s}
.logo{font-weight:700;font-size:20px;padding:4px 10px 16px}
.nv{display:flex;gap:10px;align-items:center;padding:10px 12px;border-radius:10px;border:0;background:0;color:var(--mu);text-align:left;width:100%}
.nv:hover{background:var(--p2);color:var(--tx)}.nv.on{background:var(--ac);color:#fff}
.quote{margin-top:auto;padding:14px;border:1px solid var(--bd);border-radius:12px;color:var(--mu);font-size:13px}
main{max-width:100%;margin-left:228px;padding:0 24px 40px;min-height:100vh}
.top{position:sticky;top:0;z-index:10;display:flex;align-items:center;gap:12px;justify-content:flex-end;padding:14px 0;background:var(--bg)}
.ham{display:none;margin-right:auto;background:var(--pan);border:1px solid var(--bd);border-radius:10px;padding:8px 12px}
.av{display:flex;gap:8px;align-items:center;background:var(--pan);border:1px solid var(--bd);border-radius:999px;padding:4px 14px 4px 4px}
.av b{width:30px;height:30px;border-radius:50%;background:var(--ac);color:#fff;display:grid;place-items:center}
h1{font-size:26px}h2{font-size:16px}.mu{color:var(--mu)}.sm{font-size:12px}
.hd{display:flex;justify-content:space-between;align-items:flex-end;gap:12px;flex-wrap:wrap;margin:6px 0 18px}
.g{display:grid;gap:16px}.g4{grid-template-columns:repeat(4,1fr)}.g2{grid-template-columns:1fr 1fr}.dash{grid-template-columns:minmax(0,1fr) 360px;align-items:start}
.cd{background:var(--pan);border:1px solid var(--bd);border-radius:14px;padding:18px}
.ch{display:flex;justify-content:space-between;align-items:center;margin-bottom:12px;gap:8px}
.st{display:flex;gap:14px;align-items:center}.st i{font-style:normal;width:46px;height:46px;border-radius:50%;display:grid;place-items:center;font-size:20px}
.st b{font-size:24px;display:block;line-height:1.1}
.btn{background:var(--ac);color:#fff;border:0;border-radius:10px;padding:9px 16px;font-weight:600}
.btn.s{background:var(--p2);color:var(--tx);border:1px solid var(--bd)}.btn.d{background:var(--er)}.btn.x{padding:5px 10px;font-size:12px}
.lk{background:0;border:0;color:#818cf8;font-size:13px}
.chip{display:inline-block;border-radius:999px;padding:2px 10px;font-size:12px;font-weight:600}
.Alta{background:#ef44441f;color:#f87171}.Media{background:#f59e0b1f;color:#fbbf24}.Baja{background:#22c55e1f;color:#4ade80}
.row{display:flex;align-items:center;gap:12px;padding:11px 0;border-bottom:1px solid var(--bd)}.row:last-child{border:0}.row>div:nth-child(2){flex:1;min-width:0}
.row b{font-weight:600}.dot{width:10px;height:10px;border-radius:50%;flex:none}
input[type=checkbox]{width:18px;height:18px;accent-color:var(--ac)}
.ic{background:0;border:0;color:var(--mu);padding:4px 7px;border-radius:8px}.ic:hover{background:var(--p2);color:var(--tx)}
.sg{display:grid;grid-template-columns:40px repeat(7,minmax(0,1fr));gap:0 4px;--H:44px;overflow-x:auto}
.sh{text-align:center;padding:6px 0;color:var(--mu);font-size:12px;border-radius:8px}.sh.on{background:var(--ac);color:#fff}
.sc{position:relative;height:calc(13*var(--H))}.sc.d{background:repeating-linear-gradient(var(--bd) 0 1px,transparent 1px var(--H));border-left:1px solid var(--bd)}
.sc span{position:absolute;font-size:10px;color:var(--mu);transform:translateY(-6px)}
.blk{position:absolute;left:2px;right:2px;border-radius:8px;color:#fff;padding:4px 6px;font-size:12px;font-weight:600;overflow:hidden;cursor:pointer;line-height:1.2}.blk small{display:block;font-weight:400;opacity:.85;font-size:10px}
.fl{display:flex;gap:6px;flex-wrap:wrap}
.ring{position:relative;width:130px;height:130px;flex:none}.ring svg{transform:rotate(-90deg)}.ring div{position:absolute;inset:0;display:grid;place-items:center;font-size:28px;font-weight:700}
.bar{height:8px;border-radius:99px;background:var(--p2);overflow:hidden}.bar i{display:block;height:100%;border-radius:99px}
.cols{display:flex;gap:10px;align-items:flex-end;height:150px}.cols div{flex:1;display:flex;flex-direction:column;justify-content:flex-end;align-items:center;height:100%;gap:4px;font-size:11px;color:var(--mu)}.cols i{width:100%;max-width:38px;border-radius:6px 6px 0 0;background:var(--ac);min-height:2px}
.cal{display:grid;grid-template-columns:repeat(7,1fr);gap:4px}.cal .w{text-align:center;color:var(--mu);font-size:12px;padding:4px}
.cl{min-height:78px;background:var(--p2);border:1px solid transparent;border-radius:10px;padding:5px;text-align:left;display:flex;flex-direction:column;gap:2px;overflow:hidden}.cl.o{opacity:.4}.cl.t{border-color:var(--ac)}.cl.s{background:#6366f133}
.cl em{font-style:normal;font-size:10px;border-radius:4px;padding:0 4px;color:#fff;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.tm{font-size:52px;font-weight:700;font-variant-numeric:tabular-nums}
.mb{position:fixed;inset:0;background:#000a;z-index:50;display:grid;place-items:center;padding:16px;overflow:auto}
.md{background:var(--pan);border:1px solid var(--bd);border-radius:16px;padding:22px;width:100%;max-width:420px;display:flex;flex-direction:column;gap:12px}
.md label{display:flex;flex-direction:column;gap:4px;font-size:12px;color:var(--mu)}
.md input,.md select,.in{background:var(--p2);border:1px solid var(--bd);border-radius:10px;padding:9px 11px;color:var(--tx);width:100%}.md input[type=color]{padding:2px;height:38px}
#toast{position:fixed;bottom:20px;left:50%;transform:translateX(-50%);background:var(--ac);color:#fff;padding:10px 18px;border-radius:12px;z-index:60;display:none}
.em{text-align:center;color:var(--mu);padding:22px}
.mapw{overflow:auto;padding:6px 0}.mn{display:flex;align-items:center;gap:14px}.nd{background:var(--p2);border:1px solid var(--ac);border-radius:10px;padding:6px 10px;font-size:13px;max-width:220px}.mc{display:flex;flex-direction:column;gap:8px;border-left:2px solid var(--bd);padding-left:14px;margin:4px 0}
#cw:fullscreen{background:#000;display:grid;align-content:center;padding:24px}
.clk{display:grid;grid-template-columns:1fr 1fr;gap:20px;height:clamp(220px,min(62vh,46vw),520px)}
.pn{position:relative;background:#101010;border-radius:clamp(22px,4vw,44px);display:grid;place-items:center;overflow:hidden;color:#b0b0b0}
.pn::after{content:"";position:absolute;left:0;right:0;top:50%;height:5px;margin-top:-2px;background:#000}
.nm{font-size:clamp(80px,min(24vw,40vh),340px);font-weight:800;line-height:1;font-variant-numeric:tabular-nums;letter-spacing:-.02em}
.lb{position:absolute;top:5%;left:0;right:0;text-align:center;font-size:clamp(14px,2.4vw,30px);font-weight:600}
.sg2{position:absolute;right:6%;bottom:7%;font-size:clamp(18px,3vw,44px);font-weight:800;z-index:1}
@media(max-width:1100px){.dash{grid-template-columns:minmax(0,1fr)}}
@media(max-width:900px){aside{transform:translateX(-100%)}aside.o{transform:none;box-shadow:0 0 0 100vmax #0008}main{margin:0;padding:0 14px 40px}.ham{display:block}.g4{grid-template-columns:1fr 1fr}.g2{grid-template-columns:1fr}.cl{min-height:54px}.cl em{display:none}}
@media(max-width:480px){.g4{grid-template-columns:1fr}.tm{font-size:42px}}
#sp0{position:fixed;inset:0;z-index:100;background:#0b0d1a;display:grid;place-content:center;justify-items:center;gap:14px;color:#e8eaf6;animation:spo .5s ease 1.3s forwards}
#sp0 i{font-style:normal;font-size:64px;animation:spi .9s cubic-bezier(.2,1.4,.4,1) both}
#sp0 b{font-size:26px;animation:spt .6s ease .35s both}
#sp0 u{display:block;width:120px;height:3px;border-radius:3px;background:#242949;overflow:hidden}
#sp0 u::after{content:"";display:block;height:100%;background:#6366f1;animation:spb 1.2s ease both}
@keyframes spi{from{transform:scale(.3) rotate(-25deg);opacity:0}to{transform:none;opacity:1}}
@keyframes spt{from{transform:translateY(10px);opacity:0}to{transform:none;opacity:1}}
@keyframes spb{from{width:0}to{width:100%}}
@keyframes spo{to{opacity:0;visibility:hidden}}
@media(prefers-reduced-motion:reduce){#sp0{display:none}}
main{overflow-x:clip}
@media(max-width:900px){input,select,textarea{font-size:16px!important}}
#v.pout{opacity:0;transform:translateX(-40px);transition:opacity .18s ease,transform .18s ease}
#v.pin{animation:pin .26s ease backwards}
@keyframes pin{from{opacity:0;transform:translateX(40px)}to{opacity:1;transform:none}}
@media(prefers-reduced-motion:reduce){*{transition:none!important}}
body{background:radial-gradient(900px 520px at 88% -8%,#6366f124,transparent 60%),radial-gradient(700px 420px at -8% 12%,#ec489912,transparent 60%),var(--bg);background-attachment:fixed}
::-webkit-scrollbar{width:8px;height:8px}::-webkit-scrollbar-thumb{background:var(--bd);border-radius:8px}
aside{background:linear-gradient(180deg,var(--pan),var(--bg))}.logo{font-size:22px;letter-spacing:-.02em}
.nv{transition:background .15s,color .15s}.nv.on{background:linear-gradient(135deg,#6366f1,#8b5cf6);box-shadow:0 6px 18px #6366f155}
.top{background:var(--bg);background:color-mix(in srgb,var(--bg) 80%,transparent);backdrop-filter:blur(10px);-webkit-backdrop-filter:blur(10px)}
h1{font-weight:800;letter-spacing:-.025em}
.cd{border-radius:18px;background:linear-gradient(180deg,#ffffff08,transparent 60%),var(--pan);box-shadow:0 10px 30px #0000001a;transition:border-color .2s,transform .2s}
:root[data-theme=light] .cd{box-shadow:0 6px 22px #1b1e3a14}.cd:hover{border-color:#6366f155}
.btn{background:linear-gradient(135deg,#6366f1,#8b5cf6);box-shadow:0 4px 14px #6366f14d;transition:transform .15s,filter .15s}.btn:hover{filter:brightness(1.1);transform:translateY(-1px)}
.btn.s{background:var(--p2);box-shadow:none}.btn.d{background:var(--er);box-shadow:none}.btn:disabled{opacity:.5;transform:none}
.st i{width:50px;height:50px;border-radius:16px}.st b{font-size:28px}.st:hover{transform:translateY(-2px)}
.row{transition:background .15s}.chip{letter-spacing:.2px}
.in:focus,.md input:focus,.md select:focus{border-color:var(--ac);box-shadow:0 0 0 3px #6366f13a;outline:0}
.md{border-radius:20px;box-shadow:0 20px 60px #0008}.blk{box-shadow:0 4px 12px #0003}.bar i{background-image:linear-gradient(90deg,#ffffff00,#ffffff33)}
.hg{display:grid;gap:16px;grid-template-columns:repeat(3,minmax(0,1fr));align-items:start}.hw{min-width:0}.hw.w2{grid-column:span 2}.hw.w3{grid-column:1/-1}.hw.dim>.cd{opacity:.4}
.tb{display:flex;gap:2px;margin:0 0 6px auto;width:max-content;max-width:100%;flex-wrap:wrap;background:var(--p2);border:1px solid var(--bd);border-radius:12px;padding:2px 4px}
@media(max-width:1200px){.hg{grid-template-columns:repeat(2,minmax(0,1fr))}.hw.w2{grid-column:1/-1}}
@media(max-width:760px){.hg{grid-template-columns:minmax(0,1fr)}.cd{padding:15px}}
</style></head><body><div id="sp0" aria-hidden="true"><i>🎓</i><b>StudyFlow</b><u></u></div>
<aside id="sb"><div class="logo">🎓 StudyFlow</div><div id="nav"></div><div class="quote">Disciplina hoy,<br>resultados mañana.</div></aside>
<main><div id="lkb" style="display:none;position:sticky;top:0;z-index:12;background:#dc2626;color:#fff;padding:8px 12px;border-radius:0 0 10px 10px;align-items:center;justify-content:space-between;gap:10px">🔒 Modo bloqueo activo <button class="btn s x" onclick="lock(false)">Desactivar</button></div><div class="top"><button class="ham" onclick="sb.classList.toggle('o')" aria-label="Menú">☰</button><button class="btn s x" onclick="theme()" id="th"></button><button class="av" onclick="rename()" title="Cambiar nombre"><b id="ini"></b><span id="un"></span></button></div><div id="v"></div></main>
<div id="modal"></div><div id="toast"></div>
<script>
const $=s=>document.querySelector(s),K='studyflow.v1',DAYS=['Lun','Mar','Mié','Jue','Vie','Sáb','Dom'];
const iso=d=>d.getFullYear()+'-'+String(d.getMonth()+1).padStart(2,'0')+'-'+String(d.getDate()).padStart(2,'0');
const ad=n=>{const d=new Date();d.setDate(d.getDate()+n);return iso(d)},uid=()=>Math.random().toString(36).slice(2,9);
const esc=s=>String(s??'').replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));
const pd=s=>new Date(s+'T00:00'),fd=s=>pd(s).toLocaleDateString('es-ES',{day:'numeric',month:'short'});
const dl=s=>Math.round((pd(s)-pd(iso(new Date())))/864e5);
const tn=s=>{const[a,b]=s.split(':');return +a+b/60};
function seed(){return{user:'Estudiante',theme:'dark',subjects:[],grades:[],schedule:[],tasks:[],exams:[],events:[],sessions:[],notes:[],blocks:[],home:{order:[],hide:[],sub:''}}}
let st;try{st=JSON.parse(localStorage.getItem(K))}catch(e){}const sn=()=>[],norm=()=>{['subjects','grades','schedule','tasks','exams','events','sessions','notes','blocks'].forEach(k=>{if(!Array.isArray(st[k]))st[k]=[]});if(!st.home||typeof st.home!='object')st.home={};st.home.order=st.home.order||[];st.home.hide=st.home.hide||[];if(!st.user)st.user='Estudiante'};
if(!st||!st.subjects)st=seed();norm();
const save=()=>{try{localStorage.setItem(K,JSON.stringify(st))}catch(e){toast('Almacenamiento lleno: borra alguna foto')}};
let cur='inicio',tf='all',nf='all',PF={},cm=new Date(),sel=iso(new Date());cm.setDate(1);
const sub=id=>st.subjects.find(s=>s.id==id)||{name:'—',color:'#64748b'};
const avg=id=>{const g=st.grades.filter(x=>x.subj==id),w=g.reduce((a,x)=>a+ +x.weight,0);return w?g.reduce((a,x)=>a+x.score*x.weight,0)/w:null};
const gen=()=>{const a=st.subjects.map(s=>avg(s.id)).filter(x=>x!=null);return a.length?a.reduce((x,y)=>x+y,0)/a.length:null};
const f1=n=>n==null?'—':n.toFixed(1);
const toast=m=>{const t=$('#toast');t.textContent=m;t.style.display='block';clearTimeout(t._t);t._t=setTimeout(()=>t.style.display='none',2200)};
const pill=s=>`<span class="dot" style="background:${sub(s).color}"></span>`;
// ---- CRUD
const S={
subjects:{t:'asignatura',f:[['name','Nombre','text'],['teacher','Profesor/a','text'],['color','Color','color']],d:()=>({color:'#6366f1'})},
tasks:{t:'tarea',f:[['title','Título','text'],['subj','Asignatura','subj'],['due','Fecha límite','date'],['prio','Prioridad','sel',['Alta','Media','Baja'].map(x=>[x,x])]],d:()=>({due:ad(1),prio:'Media',done:false})},
exams:{t:'examen',f:[['title','Título','text'],['subj','Asignatura','subj'],['date','Fecha','date'],['time','Hora','time']],d:()=>({date:ad(7),time:'09:00'})},
grades:{t:'nota',f:[['name','Nombre (parcial, trabajo…)','text'],['subj','Asignatura','subj'],['score','Nota (0-10)','num'],['weight','Peso','num']],d:()=>({score:7,weight:1})},
schedule:{t:'clase',f:[['subj','Asignatura','subj'],['day','Día','sel',DAYS.map((d,i)=>[i,d])],['start','Inicio','time'],['end','Fin','time']],d:()=>({day:0,start:'08:00',end:'10:00'})},
events:{t:'evento',f:[['title','Título','text'],['date','Fecha','date'],['color','Color','color']],d:()=>({date:sel,color:'#6366f1'})},
notes:{t:'nota',f:[['title','Título','text'],['type','Tipo','sel',[['Nota','Nota'],['Recordatorio','Recordatorio']]],['subj','Asignatura (opcional)','subj0'],['date','Fecha (para recordatorios)','date0'],['text','Contenido','area']],d:()=>({type:'Nota',date:'',subj:''})},
blocks:{t:'bloque',f:[['title','Título','text'],['text','Contenido','area']],d:()=>({})},
sessions:{t:'sesión de estudio',f:[['subj','Asignatura','subj'],['date','Fecha','date'],['min','Minutos','num']],d:()=>({date:iso(new Date()),min:30})}};
function openForm(c,id){const cf=S[c];if(c!='subjects'&&c!='events'&&c!='notes'&&c!='blocks'&&!st.subjects.length)return toast('Crea primero una asignatura');
const o=id?st[c].find(x=>x.id==id):{...cf.d(),...PF};PF={};
$('#modal').innerHTML=`<div class="mb" onmousedown="if(event.target==this)cm_()"><form class="md" onsubmit="saveF(event,'${c}','${id||''}')"><h2>${id?'Editar':'Nueva'} ${cf.t}</h2>${cf.f.map(([k,l,ty,op])=>{const v=o[k]??'';let i;
if(ty=='subj0')i=`<select name="${k}"><option value="">Ninguna</option>${st.subjects.map(s=>`<option value="${s.id}" ${s.id==v?'selected':''}>${esc(s.name)}</option>`).join('')}</select>`;else if(ty=='area')i=`<textarea name="${k}" rows="4" class="in" style="resize:vertical">${esc(v)}</textarea>`;else if(ty=='subj')i=`<select name="${k}">${st.subjects.map(s=>`<option value="${s.id}" ${s.id==v?'selected':''}>${esc(s.name)}</option>`).join('')}</select>`;
else if(ty=='sel')i=`<select name="${k}">${op.map(([a,b])=>`<option value="${a}" ${a==v?'selected':''}>${b}</option>`).join('')}</select>`;
else i=`<input name="${k}" type="${ty=='num'?'number':ty=='date0'?'date':ty}" ${ty=='num'?'step="0.1" min="0"'+(k=='score'?' max="10"':''):''} value="${esc(v)}" ${ty=='date0'||k=='teacher'?'':'required'}>`;
return`<label>${l}${i}</label>`}).join('')}${c=='notes'?`<div><div class="fl"><label class="btn s x">📷 Hacer foto<input type="file" accept="image/*" capture="environment" style="display:none" onchange="nAdd(this)"></label><label class="btn s x">⬆ Subir fotos<input type="file" accept="image/*" multiple style="display:none" onchange="nAdd(this)"></label></div><div class="fl" id="ph" style="margin-top:8px"></div></div>`:''}<div class="fl" style="justify-content:flex-end;margin-top:6px">${id?`<button type="button" class="btn d" style="margin-right:auto" onclick="del('${c}','${id}')">Eliminar</button>`:''}<button type="button" class="btn s" onclick="cm_()">Cancelar</button><button class="btn">Guardar</button></div></form></div>`;
if(c=='notes'){NI=[...(o.imgs||[])];phR()}const i=$('#modal input[type=text],#modal select');i&&i.focus()}
const cm_=()=>$('#modal').innerHTML='';
function saveF(e,c,id){e.preventDefault();const fd=new FormData(e.target),v={};S[c].f.forEach(([k,,ty])=>{let x=fd.get(k);if(ty=='num')x=+x;if(k=='day')x=+x;v[k]=typeof x=='string'?x.trim():x});
if(c=='notes')v.imgs=[...NI];if(c=='schedule'&&tn(v.end)<=tn(v.start))return toast('La hora de fin debe ser posterior');
if(id)Object.assign(st[c].find(x=>x.id==id),v);else{const n={id:uid(),...v};if(c=='tasks')n.done=false;st[c].push(n)}
save();cm_();render();toast('Guardado')}
function del(c,id){if(c=='subjects'){['tasks','exams','grades','schedule','sessions'].forEach(k=>st[k]=st[k].filter(x=>x.subj!=id));st.notes.forEach(n=>{if(n.subj==id)n.subj=''})}
st[c]=st[c].filter(x=>x.id!=id);save();cm_();render();toast('Eliminado')}
const tog=id=>{const t=st.tasks.find(x=>x.id==id);t.done=!t.done;save();render()};
const tgn=id=>{const n=st.notes.find(x=>x.id==id);n.done=!n.done;save();render()};
function bk(){const j=JSON.stringify(st);(navigator.clipboard?navigator.clipboard.writeText(j).then(()=>toast('Datos copiados')):Promise.reject()).catch(()=>ask('Copia tus datos',j,()=>{}))}
function imp(){ask('Pega aquí tu copia de seguridad','',t=>{if(!t)return;try{const d=JSON.parse(t);if(!d.subjects)throw 0;st=d;norm();save();render();toast('Datos importados')}catch(e){toast('Los datos no son válidos')}})}
function rst(){ask('Se borrará todo. ¿Continuar?','',()=>{st=seed();st.notes=sn();save();render();toast('Datos restablecidos')},'c')}
function rename(){ask('Tu nombre',st.user,n=>{if(n&&n.trim()){st.user=n.trim();save();render()}})}

estadisticas(){const tot=st.sessions.reduce((a,x)=>a+x.min,0),dn=st.tasks.filter(t=>t.done).length,mx=Math.max(1,...st.subjects.map(s=>st.sessions.filter(x=>x.subj==s.id).reduce((a,x)=>a+x.min,0)));
const k=(l,v)=>`<div class="cd"><span class="mu sm">${l}</span><b style="font-size:24px;display:block">${v}</b></div>`;
return hd('Estadísticas','Tu progreso de estudio')+`<div class="g g4" style="margin-bottom:16px">${k('Tiempo total',(tot/60).toFixed(1)+' h')}${k('Sesiones',st.sessions.length)}${k('Tareas hechas',dn+'/'+st.tasks.length)}${k('Media general',f1(gen()))}</div>
<div class="g g2"><div class="cd"><h2>Últimos 7 días</h2><div style="margin-top:12px">${wk()}</div></div><div class="cd"><h2>Tiempo por asignatura</h2>${st.subjects.map(s=>{const m=st.sessions.filter(x=>x.subj==s.id).reduce((a,x)=>a+x.min,0);return`<div style="margin-top:12px"><div class="fl" style="justify-content:space-between"><span>${esc(s.name)}</span><span class="mu">${m} min</span></div><div class="bar"><i style="width:${m/mx*100}%;background:${s.color}"></i></div></div>`}).join('')}</div>
<div class="cd"><h2>Notas por asignatura</h2>${st.subjects.map(s=>`<div style="margin-top:12px"><div class="fl" style="justify-content:space-between"><span>${esc(s.name)}</span><b>${f1(avg(s.id))}</b></div><div class="bar"><i style="width:${(avg(s.id)||0)*10}%;background:${s.color}"></i></div></div>`).join('')}</div></div>`}};
function wk(){const d=[...Array(7)].map((_,i)=>{const dt=new Date();dt.setDate(dt.getDate()-6+i);const k=iso(dt);return[dt.toLocaleDateString('es-ES',{weekday:'short'}),st.sessions.filter(x=>x.date==k).reduce((a,x)=>a+x.min,0)]}),mx=Math.max(30,...d.map(x=>x[1]));
return`<div class="cols">${d.map(([l,m])=>`<div>${m||''}<i style="height:${m/mx*100}%"></i>${l}</div>`).join('')}</div><div class="mu sm" style="margin-top:8px">Minutos estudiados por día</div>`}
const NAV=[['inicio','🏠','Inicio'],['horario','📅','Horario'],['tareas','✅','Tareas'],['examenes','📝','Exámenes'],['examenia','🧠','Examen IA'],['calendario','🗓','Calendario'],['notas','📊','Calificaciones'],['apuntes','🗒','Apuntes'],['materias','📚','Asignaturas'],['temporizador','⏱','Temporizador'],['crear','✨','Crear apuntes'],['spotify','🎧','Spotify'],['classroom','🏫','Classroom'],['reloj','🕒','Reloj'],['estadisticas','📈','Estadísticas'],['ajustes','⚙','Ajustes']];
let TR=0,TV='';
function go(v){$('#sb').classList.remove('o');const el=$('#v');if(v==cur||matchMedia('(prefers-reduced-motion:reduce)').matches){cur=v;render();scrollTo(0,0);return}
TV=v;if(TR)return;TR=1;el.className='pout';setTimeout(()=>{cur=TV;render();scrollTo(0,0);el.className='pin';setTimeout(()=>{el.className='';TR=0},260)},180)}
function render(){document.documentElement.dataset.theme=st.theme;$('#th').textContent=st.theme=='dark'?'☀ Claro':'🌙 Oscuro';$('#un').textContent=st.user;$('#ini').textContent=st.user[0].toUpperCase();
$('#nav').innerHTML=NAV.map(([k,i,l])=>`<button class="nv ${k==cur?'on':''}" onclick="go('${k}')">${i} ${l}</button>`).join('');$('#v').innerHTML=V[cur]();tickC();$('#lkb').style.display=LK?'flex':'none';if(!T.run)document.title='StudyFlow'}
setTimeout(()=>{const e=$('#sp0');e&&e.remove()},1900);
document.addEventListener('click',e=>{const a=$('#sb');if(a.classList.contains('o')&&!e.target.closest('#sb,.ham'))a.classList.remove('o')});
document.addEventListener('keydown',e=>{if(e.key=='Escape')cm_()});render();
</script></body></html>
