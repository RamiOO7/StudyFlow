<!DOCTYPE html><html lang="es"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><title>StudyFlow</title>
<style>

body{background:radial-gradient(900px 520px at 88% -8%,#6366f124,transparent 60%),radial-gradient(700px 420px at -8% 12%,#ec489912,transparent 60%),var(--bg);background-attachment:fixed}

h1{font-weight:800;letter-spacing:-.025em}

:root[data-theme=light] .cd{box-shadow:0 6px 22px #1b1e3a14}.cd:hover{border-color:#6366f155}
.btn{background:linear-gradient(135deg,#6366f1,#8b5cf6);box-shadow:0 4px 14px #6366f14d;transition:transform .15s,filter .15s}.btn:hover{filter:brightness(1.1);transform:translateY(-1px)}

</style></head><body><div id="sp0" aria-hidden="true"><b>StudyFlow</b><u></u></div>
<aside id="sb"><div class="logo">🎓 StudyFlow</div><div id="nav"></div><div class="quote">Disciplina hoy,<br>resultados mañana.</div><div class="sm mu" style="padding:10px 6px 0;text-align:center">© 2026 RamiOO7</div></aside>
<main><div id="lkb" style="display:none;position:sticky;top:0;z-index:12;background:#dc2626;color:#fff;padding:8px 12px;border-radius:0 0 10px 10px;align-items:center;justify-content:space-between;gap:10px">🔒 Modo bloqueo activo <button class="btn s x" onclick="lock(false)">Desactivar</button></div><div class="top"><button class="ham" onclick="sb.classList.toggle('o')" aria-label="Menú">☰</button><button class="btn s x" id="bell" onclick="showAl()" aria-label="Avisos">🔔<b id="bn"></b></button><button class="btn s x" onclick="theme()" id="th"></button><button class="av" onclick="rename()" title="Cambiar nombre"><b id="ini"></b><span id="un"></span></button></div><div id="v"></div></main>
<div id="modal"></div><div id="toast"></div>
<script>
const LC=()=>st.lang=='en'?'en-GB':'es-ES',$=s=>document.querySelector(s),K='studyflow.v1',DAYS=['Lun','Mar','Mié','Jue','Vie','Sáb','Dom'];
const iso=d=>d.getFullYear()+'-'+String(d.getMonth()+1).padStart(2,'0')+'-'+String(d.getDate()).padStart(2,'0');
const ad=n=>{const d=new Date();d.setDate(d.getDate()+n);return iso(d)},uid=()=>Math.random().toString(36).slice(2,9);
const esc=s=>String(s??'').replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));
const pd=s=>new Date(s+'T00:00'),fd=s=>pd(s).toLocaleDateString(LC(),{day:'numeric',month:'short'});
const dl=s=>Math.round((pd(s)-pd(iso(new Date())))/864e5);
const tn=s=>{const[a,b]=s.split(':');return +a+b/60};
function seed(){return{user:'Estudiante',theme:'dark',subjects:[],grades:[],schedule:[],tasks:[],exams:[],events:[],sessions:[],notes:[],blocks:[],home:{order:[],hide:[],sub:''}}}
let st;try{st=JSON.parse(localStorage.getItem(K))}catch(e){}const sn=()=>[],norm=()=>{['subjects','grades','schedule','tasks','exams','events','sessions','notes','blocks'].forEach(k=>{if(!Array.isArray(st[k]))st[k]=[]});if(!st.home||typeof st.home!='object')st.home={};if(!st.pm||typeof st.pm!='object')st.pm={f:25,b:5,r:3};st.vol=st.vol||1;st.lang=st.lang||'es';if(!st.curso||!st.curso.ini)st.curso={ini:'2026-09-07',fin:'2027-06-18'};st.home.order=st.home.order||[];st.home.hide=st.home.hide||[];if(!st.user)st.user='Estudiante'};
if(!st||!st.subjects)st=seed();norm();
const save=()=>{try{localStorage.setItem(K,JSON.stringify(st))}catch(e){toast('Almacenamiento lleno: borra alguna foto')}};
let cur='inicio',tf='all',nf='all',PF={},cm=new Date(),sel=iso(new Date());cm.setDate(1);
const sub=id=>st.subjects.find(s=>s.id==id)||{name:'—',color:'#64748b'};
const avg=id=>{const g=st.grades.filter(x=>x.subj==id),w=g.reduce((a,x)=>a+ +x.weight,0);return w?g.reduce((a,x)=>a+x.score*x.weight,0)/w:null};
const gen=()=>{const a=st.subjects.map(s=>avg(s.id)).filter(x=>x!=null);return a.length?a.reduce((x,y)=>x+y,0)/a.length:null};
const RK=[['Hierro',0,'#cbd5e1','#64748b'],['Bronce',4,'#f0b27a','#9a4f1a'],['Plata',5.5,'#ffffff','#94a3b8'],['Oro',6.5,'#fff3a3','#d97706'],['Platino',7.5,'#a7f3d0','#0e9aa7'],['Diamante',8.5,'#c4b5fd','#4338ca'],['Inmortal',9.2,'#fecdd3','#be123c'],['Radiante',9.7,'#fef08a','#ea580c']],RM=['I','II','III'];
const rk=n=>{if(n==null)return null;let i=0;RK.forEach((r,k)=>{if(n>=r[1])i=k});const t=RK[i],x=RK[i+1],top=i>=6;let dv=0,nx=null,need=0,pr=1;
if(x){const sp=x[1]-t[1];if(top){need=x[1]-n;nx=x[0];pr=(n-t[1])/sp}else{pr=(n-t[1])/sp;dv=Math.min(2,Math.floor(pr*3));need=t[1]+sp*(dv+1)/3-n;nx=dv<2?t[0]+' '+RM[dv+1]:x[0]+(i==5?'':' I');pr=(n-(t[1]+sp*dv/3))/(sp/3)}}
return{i,t:t[0],c1:t[2],c2:t[3],div:top?-1:dv,name:t[0]+(top?'':' '+RM[dv]),nx,need,pr:Math.max(0,Math.min(1,pr))}};
let _b=0;const badge=(r,z)=>{const u='bg'+(_b++),ch=r.div>=0?r.div+1:0,f=`url(#${u})`;
return`<svg class="bdg" width="${z}" height="${Math.round(z*1.2)}" viewBox="-12 0 124 120" style="--c:${r.c1}" role="img" aria-label="${r.name}"><defs><linearGradient id="${u}" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="${r.c1}"/><stop offset="1" stop-color="${r.c2}"/></linearGradient></defs>${r.i>=5?`<path d="M18 46 L-10 28 L-3 66 L16 76Z M82 46 L110 28 L103 66 L84 76Z" fill="${f}" opacity=".85"/>`:''}<path d="M50 3 L93 19 V62 C93 90 71 108 50 117 C29 108 7 90 7 62 V19Z" fill="${f}"/><path d="M50 12 L84 25 V61 C84 83 67 97 50 105 C33 97 16 83 16 61 V25Z" fill="#0b0d1a" fill-opacity=".84" stroke="${f}" stroke-width="1.5"/>${r.i<3?`<path d="M50 30 L69 52 L50 74 L31 52Z" fill="${f}"/>`:`<path d="M50 28 L57 46 L76 47 L61.5 59 L66 77 L50 67 L34 77 L38.5 59 L24 47 L43 46Z" fill="${f}"/>`}${r.i>=6?'<circle cx="50" cy="9" r="5" fill="#fff"/>':''}${[...Array(ch)].map((_,k)=>{const x=50-(ch-1)*8+k*16;return`<path d="M${x-7} 87 L${x} 94 L${x+7} 87" fill="none" stroke="${f}" stroke-width="3" stroke-linecap="round"/>`}).join('')}</svg>`};
const rkChip=n=>{const r=rk(n);return r?`<span class="chip" style="background:${r.c2}40;color:${r.c1};display:inline-flex;align-items:center;gap:5px">${badge(r,15)}${r.name}</span>`:''};
const f1=n=>n==null?'—':n.toFixed(1);
const toast=m=>{const t=$('#toast');t.textContent=m;t.style.display='block';clearTimeout(t._t);t._t=setTimeout(()=>t.style.display='none',2200)};
const pill=s=>`<span class="dot" style="background:${sub(s).color}"></span>`;
// ---- CRUD
const NEW={subjects:'Nueva asignatura',tasks:'Nueva tarea',exams:'Nuevo examen',grades:'Nueva calificación',schedule:'Nueva clase',events:'Nuevo evento',notes:'Nueva nota',blocks:'Nuevo bloque',sessions:'Nueva sesión de estudio'};
const S={
subjects:{t:'asignatura',f:[['name','Nombre','text'],['teacher','Profesor/a','text'],['color','Color','color']],d:()=>({color:'#6366f1'})},
tasks:{t:'tarea',f:[['title','Título','text'],['subj','Asignatura','subj'],['due','Fecha límite','date'],['prio','Prioridad','sel',['Alta','Media','Baja'].map(x=>[x,x])]],d:()=>({due:ad(1),prio:'Media',done:false})},
exams:{t:'examen',f:[['title','Título','text'],['subj','Asignatura','subj'],['date','Fecha','date'],['time','Hora','time']],d:()=>({date:ad(7),time:'09:00'})},
grades:{t:'calificación',f:[['name','Nombre (parcial, trabajo…)','text'],['subj','Asignatura','subj'],['score','Nota (0-10)','num'],['weight','Peso','num']],d:()=>({score:7,weight:1})},
schedule:{t:'clase',f:[['subj','Asignatura','subj'],['day','Día','sel',DAYS.map((d,i)=>[i,d])],['start','Empieza','time'],['end','Termina','time']],d:()=>({day:0,start:'08:00',end:'10:00'})},
events:{t:'evento',f:[['title','Título','text'],['date','Fecha','date'],['color','Color','color']],d:()=>({date:sel,color:'#6366f1'})},
notes:{t:'nota',f:[['title','Título','text'],['type','Tipo','sel',[['Nota','Nota'],['Recordatorio','Recordatorio']]],['subj','Asignatura (opcional)','subj0'],['date','Fecha (para recordatorios)','date0'],['text','Contenido','area']],d:()=>({type:'Nota',date:'',subj:''})},
blocks:{t:'bloque',f:[['title','Título','text'],['text','Contenido','area']],d:()=>({})},
